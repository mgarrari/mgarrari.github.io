<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Radar Sprint2</title><style>body{margin:0;font-family:Arial;background:#f5f7fa;display:flex}aside{width:240px;background:#111827;color:#fff;height:100vh;position:fixed;padding:20px}aside a{display:block;color:#cbd5e1;text-decoration:none;padding:6px 0}main{margin-left:260px;padding:24px;max-width:1100px}.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}input{width:100%;padding:10px}.tag{background:#dcfce7;padding:2px 8px;border-radius:999px;font-size:12px}.hidden{display:none}</style></head><body><aside><h2>Radar IT</h2><a href='#'>Dashboard</a></aside><main><h1>Sprint 2</h1><div class='card'><b>21 empresas</b> · 4 A+ · Objetivo 80-100k+</div><div class='card'><h2>Desde tu última visita</h2><ul><li>Roche sigue siendo la prioridad nº1.</li><li>JTI mantiene el hub IT de Madrid como objetivo.</li><li>IQVIA gana peso.</li><li>Microsoft queda en observación.</li></ul></div><div class='card'><input id='q' placeholder='Buscar...' oninput='f()'></div><div id='list'></div></main><script>const c=[['Roche','96','A+','85-100k','Digital Technology','Head Digital Technology Madrid','Completar organigrama'],['JTI','94','A+','85-105k','IT Operations','IT Director Western Europe','Mapear managers'],['IQVIA','91','A+','85-100k','IQVIA Digital','Director IQVIA Digital España','Director Digital'],['Iberdrola','90','A+','85-100k','Corporate ICT','Head Corporate ICT','Corporate ICT Madrid'],['Microsoft','84','A','85-110k','Customer Transformation','Head Utilities','Esperar apertura'],['BBVA','83','A','85-100k','Technology Transformation','Head Technology','Mapear responsables'],['Santander','82','A','85-100k','IT Delivery','Director Digital Services','Vigilar'],['Google','79','A+ estratégico','90-120k','Cloud','Head Customer Engineering','Monitorizar'],['OpenAI','78','A+ estratégico','90-140k','Enterprise','Head Enterprise Iberia','Monitorizar'],['Revolut','77','A','80-110k','Operations','Head Operations Spain','Vigilar']];function r(a){const l=document.getElementById('list');l.innerHTML='';a.forEach(e=>{const d=document.createElement('div');d.className='card';d.innerHTML='<h3>'+e[0]+' <span class=tag>'+e[2]+'</span> Score '+e[1]+'</h3><p>'+e[3]+' · '+e[4]+'</p><p><b>Puerta:</b> '+e[5]+'</p><button onclick="this.nextElementSibling.classList.toggle(\'hidden\')">Ver ficha</button><div class=hidden><hr><p><b>Próximo movimiento:</b> '+e[6]+'</p></div>';l.appendChild(d);});}function f(){const q=document.getElementById('q').value.toLowerCase();r(c.filter(e=>e.join(' ').toLowerCase().includes(q)));}r(c);</script></body></html>
